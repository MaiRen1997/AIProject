services:
  # 前端服务
  rowen-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: rowen-frontend:latest
    container_name: rowen-frontend
    ports:
      - "12580:80"
    volumes:
      - ./frontend/bin/nginx.dockermy.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - rowen-backend-my
    networks:
      - rowen-network

  # 后端服务（MySQL版本）
  rowen-backend-my:
    build:
      context: ./backend
      dockerfile: Dockerfile.my
    image: rowen-backend-my:latest
    container_name: rowen-backend-my
    ports:
      - "19099:9099"
    environment:
      DB_HOST: rowen-mysql
      DB_PORT: 3306
      DB_USERNAME: rowen
      DB_PASSWORD: rowen123
      DB_DATABASE: rowen-fastapi
      REDIS_HOST: rowen-redis
      REDIS_PORT: 6379
      REDIS_USERNAME: ""
      REDIS_PASSWORD: root
    depends_on:
      rowen-mysql:
        condition: service_healthy
      rowen-redis:
        condition: service_healthy
    networks:
      - rowen-network

  # MySQL服务
  rowen-mysql:
    image: mysql:8.0
    container_name: rowen-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rowen-fastapi
      MYSQL_USER: rowen
      MYSQL_PASSWORD: rowen123
    ports:
      - "13306:3306"
    volumes:
      - ./backend/sql/ruoyi-fastapi.sql:/docker-entrypoint-initdb.d/ruoyi-fastapi.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci --skip-character-set-client-handshake=1
    networks:
      - rowen-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Redis服务
  rowen-redis:
    image: redis:latest
    container_name: rowen-redis
    command: ["redis-server", "--requirepass", "root"]
    ports:
      - "16379:6379"
    networks:
      - rowen-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "root", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30

# 网络配置
networks:
  rowen-network:
    name: rowen-network
    driver: bridge