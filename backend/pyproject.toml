[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "rowen-fastapi-backend-cli"
version = "1.9.0"
description = "Rowen FastAPI backend internal CLI entrypoint"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.3.2",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.2",
]

[project.scripts]
rowen = "cli.main:main"

[tool.setuptools.packages.find]
include = ["cli*"]
