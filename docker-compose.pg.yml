services:
  # 前端服务
  rowen-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: rowen-frontend:latest
    container_name: rowen-frontend
    ports:
      - "12580:80"
    volumes:
      - ./frontend/bin/nginx.dockerpg.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - rowen-backend-pg
    networks:
      - rowen-network

  # 后端服务（PostgreSQL版本）
  rowen-backend-pg:
    build:
      context: ./backend
      dockerfile: Dockerfile.pg
    image: rowen-backend-pg:latest
    container_name: rowen-backend-pg
    ports:
      - "19099:9099"
    depends_on:
      rowen-pg:
        condition: service_healthy
      rowen-redis:
        condition: service_healthy
    networks:
      - rowen-network

  # PostgreSQL服务
  rowen-pg:
    image: postgres:14
    container_name: rowen-pg
    environment:
      POSTGRES_PASSWORD: root
      POSTGRES_DB: rowen-fastapi
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --lc-collate=C --lc-ctype=C
    ports:
      - "15432:5432"
    volumes:
      - ./backend/sql/ruoyi-fastapi-pg.sql:/docker-entrypoint-initdb.d/ruoyi-fastapi-pg.sql
    networks:
      - rowen-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Redis服务
  rowen-redis:
    image: redis:latest
    container_name: rowen-redis
    ports:
      - "16379:6379"
    networks:
      - rowen-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30

# 网络配置
networks:
  rowen-network:
    name: rowen-network
    driver: bridge